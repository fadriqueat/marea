<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marea: Mar de Piratas</title>
<meta name="description" content="Marea, un juego de piratas para iPhone: navega, pesca y hazte leyenda.">
<style>
:root{--bg:#0e1a2b;--card:#15263d;--oro:#e0b75a;--txt:#efe6d2;--suave:#a9b4c2}
@media (prefers-color-scheme: light){:root{--bg:#f4efe3;--card:#fffaf0;--oro:#a0741d;--txt:#1d2733;--suave:#56606b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:17px/1.55 Georgia,"Times New Roman",serif;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px 16px}
main{max-width:520px;width:100%;text-align:center;background:var(--card);border:1px solid color-mix(in srgb,var(--oro) 45%,transparent);border-radius:22px;padding:36px 24px}
img{width:128px;height:128px;border-radius:28px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
h1{font-size:30px;letter-spacing:.06em;color:var(--oro);margin:20px 0 6px;text-transform:uppercase}
p{color:var(--suave);margin:0 0 24px}
a{display:block;margin:10px 0;padding:14px;border-radius:14px;border:1px solid var(--oro);color:var(--txt);text-decoration:none}
a:hover{background:color-mix(in srgb,var(--oro) 15%,transparent)}
small{display:block;margin-top:22px;color:var(--suave)}
</style>
</head>
<body>
<main>
<img src="icono.png" alt="Icono de Marea">
<h1>Marea</h1>
<p>Un mar entero de piratas en tu iPhone.<br><span lang="en">A whole sea of pirates on your iPhone.</span></p>

<a href="privacidad.html">Privacidad · Privacy</a>
<small>© 2026 Fadrique Álvarez de Toledo Abaitua</small>
</main>
</body>
</html>
